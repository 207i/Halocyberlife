<div class="mode-preview" id="modePreview">
  <img
    id="modePreviewImage"
    src=""
    alt="Expanded mode preview"
  >
</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

  /* =========================================================
     MODE HOVER PREVIEW
     ========================================================= */

  const modePreview =
    document.getElementById("modePreview");

  const modePreviewImage =
    document.getElementById("modePreviewImage");

  const modeImages =
    document.querySelectorAll(".mode img");


  modeImages.forEach((image) => {

    image.addEventListener("mouseenter", () => {

      modePreviewImage.src = image.src;
      modePreviewImage.alt = image.alt;

      modePreview.classList.add("show");

    });

  });


  modePreviewImage.addEventListener("mouseleave", () => {

    modePreview.classList.remove("show");

    setTimeout(() => {

      if (!modePreview.classList.contains("show")) {
        modePreviewImage.src = "";
      }

    }, 250);

  });



  /* =========================================================
     DYNAMIC YEAR
     ========================================================= */

  const yearElement =
    document.getElementById("year");

  if (yearElement) {
    yearElement.textContent =
      new Date().getFullYear();
  }



  /* =========================================================
     BACK TO TOP
     ========================================================= */

  const backToTopBtn =
    document.querySelector(".back-to-top");


  if (backToTopBtn) {

    window.addEventListener("scroll", () => {

      if (window.scrollY > 400) {

        backToTopBtn.classList.add("show");

      } else {

        backToTopBtn.classList.remove("show");

      }

    });


    backToTopBtn.addEventListener("click", () => {

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    });

  }

</script>

</body>
</html>
