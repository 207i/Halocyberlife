
<!-- ========================================
     BIOTREE EXPLORER — PREVIEW ENGINE
     Corrected Image Resolution
========================================= -->

<script>
(() => {

  'use strict';

  /* ========================================
     IMAGE DIRECTORY AND FILE MAPPING
  ========================================= */

 
const IMAGE_DIRECTORY = '/images/BioTree/';

const IMAGE_FILES = {
  'biotree-01-hero.webp': 'biotree-01-hero.webp',

  'biotree-02-solar-canopy.webp': 'Futuristic BioTree Solar Installation-2.webp',

  'biotree-03-material-detail.webp': 'biotree-03-material-detail.webp',

  'biotree-04-thermal-tank.webp': 'biotree-04-thermal-tank.webp',

  'biotree-05-public-comfort.webp': 'biotree-05-public-comfort.webp',

  'biotree-06-charging.webp': 'biotree-06-charging.webp',

  'biotree-07-water-station.webp': 'BioTree Public Water Station.png',

  'biotree-08-night.webp': 'Futuristic BioTree Night Plaza.png',

  'biotree-09-urban-plaza.webp': 'biotree-09-urban-plaza.webp',

  'biotree-10-community-park.webp': 'biotree-10-community-park.webp',

  'biotree-11-campus.webp': 'biotree-11-campus.webp',

  'biotree-12-network.webp': 'biotree-12-network.webp'
};

function resolveImagePath(value) {
  if (!value) return '';

  const filename = value.trim().split('/').pop();

  const actualFilename =
    IMAGE_FILES[filename] || filename;

  return IMAGE_DIRECTORY +
    encodeURIComponent(actualFilename);
}

  /* ========================================
     PUBLIC SYSTEM CONFIGURATION
     IDs reserved for future GLB model groups.
  ========================================= */

  const systems = [

    {
      id: 'BT_PUBLIC_EXTERIOR',
      label: 'Complete Exterior',
      title: 'Integrated Environmental Architecture',
      image: 'biotree-01-hero.webp',
      description:
        'BioTree investigates how nature-inspired architecture, renewable energy, thermal storage, environmental comfort and community services could be integrated within one public infrastructure system.'
    },

    {
      id: 'BT_PUBLIC_SOLAR',
      label: 'Solar Canopy',
      title: 'Photovoltaic Leaf Canopy',
      image: 'biotree-02-solar-canopy.webp',
      description:
        'Leaf-shaped photovoltaic surfaces explore solar electricity generation while providing architectural shade. Energy production depends on location, orientation, climate and final photovoltaic specifications.'
    },

    {
      id: 'BT_PUBLIC_THERMAL_TANK',
      label: 'Thermal Energy Storage',
      title: 'Above-Ground Sand-Based Thermal Battery',
      image: 'biotree-04-thermal-tank.webp',
      description:
        'The proposed above-ground thermal storage tank investigates the retention of energy as heat within a sand-based storage medium. Recovering electricity from stored heat would require suitable energy conversion equipment.'
    },

    {
      id: 'BT_PUBLIC_THERMAL_PROTECTION',
      label: 'Thermal Protection',
      title: 'Thermal Insulation and Protective Systems',
      image: null,
      description:
        'Proposed insulation, temperature monitoring and protective barriers investigate ways to limit heat transfer, protect surrounding components and prevent unintended public contact. Performance remains subject to engineering validation.'
    },

    {
      id: 'BT_PUBLIC_STRUCTURE',
      label: 'Structural Framework',
      title: 'Integrated Structural Architecture',
      image: 'biotree-03-material-detail.webp',
      description:
        'The proposed engineered metallic framework supports the architectural canopy and integrated systems. Wind resistance, foundation design, loading and structural capacity require detailed engineering assessment.'
    },

    {
      id: 'BT_PUBLIC_ELECTRICAL',
      label: 'Energy Management',
      title: 'Renewable Energy Management',
      image: null,
      description:
        'BioTree explores electrical energy distribution, monitoring and management across selected public services. Final electrical architecture, protection and storage requirements remain under investigation.'
    },

    {
      id: 'BT_PUBLIC_CHARGING',
      label: 'Charging Lockers',
      title: 'Public Personal-Device Charging',
      image: 'biotree-06-charging.webp',
      description:
        'Ten proposed integrated charging lockers explore convenient access to personal-device charging within public spaces. Electrical protection, accessibility and operational management require further evaluation.'
    },

    {
      id: 'BT_PUBLIC_RESPIRATORY',
      label: 'Respiratory System',
      title: 'Air Intake and Circulation',
      image: null,
      description:
        'The central respiratory intake crown explores controlled air movement and circulation within the architectural system. Airflow performance, filtration and energy requirements remain subject to technical research.'
    },

    {
      id: 'BT_PUBLIC_MIST',
      label: 'Mist Cooling',
      title: 'Controlled Environmental Cooling',
      image: 'biotree-05-public-comfort.webp',
      description:
        'Controlled mist cooling investigates potential improvements to outdoor thermal comfort. Effectiveness depends on humidity, temperature, water quality, wind conditions and system design.'
    },

    {
      id: 'BT_PUBLIC_WATER',
      label: 'Water Systems',
      title: 'Independent Public Water Station',
      image: 'biotree-07-water-station.webp',
      description:
        'Proposed water collection, treatment and independent drinking-water services explore public accessibility. Potable water must meet applicable health and regulatory requirements before public use.'
    },

    {
      id: 'BT_PUBLIC_UNDERGROUND',
      label: 'Underground Utilities',
      title: 'Underground Mechanical Utilities',
      image: null,
      description:
        'Selected mechanical and utility connections may be integrated below ground to support the architectural installation. The sand-based thermal storage tank remains above ground.'
    },

    {
      id: 'BT_PUBLIC_MAINTENANCE',
      label: 'Maintenance Access',
      title: 'Serviceability and Controlled Access',
      image: null,
      description:
        'Proposed service walkways and maintenance access investigate how qualified personnel could inspect and maintain system components while separating technical areas from public activity.'
    },

    {
      id: 'BT_PUBLIC_LIGHTING',
      label: 'Architectural Lighting',
      title: 'BioTree After Sunset',
      image: 'biotree-08-night.webp',
      description:
        'Integrated warm-white lighting explores nighttime visibility, architectural character and public-space comfort. Nighttime operation depends on the final energy supply and lighting design.'
    },

    {
      id: 'BT_PUBLIC_SEATING',
      label: 'Integrated Seating',
      title: 'Human-Centered Public Space',
      image: 'biotree-05-public-comfort.webp',
      description:
        'Circular integrated seating explores a welcoming environment for relaxation, social interaction and everyday community use. Accessibility and ergonomic requirements remain part of the design process.'
    }

  ];

  /* ========================================
     DOM REFERENCES
  ========================================= */

  const viewport =
    document.getElementById('biotree-viewport');

  const preview =
    document.getElementById('biotree-preview');

  const placeholder =
    document.getElementById('biotree-placeholder');

  const placeholderTitle =
    document.getElementById('biotree-placeholder-title');

  const viewerStatus =
    document.getElementById('biotree-viewer-status');

  const layerList =
    document.getElementById('biotree-layer-list');

  const systemTitle =
    document.getElementById('biotree-system-title');

  const systemDescription =
    document.getElementById('biotree-system-description');

  const fullscreenButton =
    document.getElementById('biotree-fullscreen');

  if (
    !viewport ||
    !preview ||
    !placeholder ||
    !placeholderTitle ||
    !viewerStatus ||
    !layerList ||
    !systemTitle ||
    !systemDescription ||
    !fullscreenButton
  ) {

    console.error('BioTree Explorer: Required elements missing.');
    return;

  }

  let activeImageRequest = 0;

  /* ========================================
     LOAD STATIC IMAGES
  ========================================= */

  document.querySelectorAll(
    '.bt-media img[data-src]'
  ).forEach((image) => {

    const media = image.closest('.bt-media');

    const fallback = media
      ? media.querySelector('.bt-media-placeholder')
      : null;

    image.addEventListener('load', () => {

      image.hidden = false;

      if (fallback) {
        fallback.hidden = true;
      }

    });

    image.addEventListener('error', () => {

      image.hidden = true;

      if (fallback) {
        fallback.hidden = false;
      }

      console.warn(
        'BioTree image unavailable:',
        image.src
      );

    });

    image.decoding = 'async';

    /* CORRECTED IMAGE PATH */

    image.src = resolveImagePath(image.dataset.src);

  });

  /* ========================================
     MAIN VIEWPORT IMAGE LOADER
  ========================================= */

  function loadPreview(system) {

    const request = ++activeImageRequest;

    preview.hidden = true;
    placeholder.hidden = false;

    placeholderTitle.textContent = system.label;

    if (!system.image) {

      viewerStatus.textContent =
        'System information available. Dedicated visualization and interactive 3D layer in development.';

      return;

    }

    viewerStatus.textContent =
      'Loading architectural preview...';

    const loader = new Image();

    loader.onload = () => {

      if (request !== activeImageRequest) {
        return;
      }

      preview.src = loader.src;

      preview.alt =
        'BioTree — ' + system.label;

      preview.hidden = false;
      placeholder.hidden = true;

      viewerStatus.textContent =
        system.label +
        ' · Architectural concept preview. Interactive 3D model in development.';

    };

    loader.onerror = () => {

      if (request !== activeImageRequest) {
        return;
      }

      preview.hidden = true;
      placeholder.hidden = false;

      viewerStatus.textContent =
        system.label +
        ' · Visualization in preparation.';

      console.warn(
        'BioTree preview unavailable:',
        loader.src
      );

    };

    /* CORRECTED IMAGE PATH */

    loader.src = resolveImagePath(system.image);

  }

  /* ========================================
     SELECT SYSTEM
  ========================================= */

  function selectSystem(systemId) {

    const system = systems.find(
      (item) => item.id === systemId
    );

    if (!system) {
      return;
    }

    systemTitle.textContent = system.title;

    systemDescription.textContent =
      system.description;

    layerList.querySelectorAll(
      '.bt-layer-button'
    ).forEach((button) => {

      button.setAttribute(
        'aria-pressed',
        String(button.dataset.system === systemId)
      );

    });

    document.querySelectorAll(
      '.bt-perspective'
    ).forEach((button) => {

      button.setAttribute(
        'aria-pressed',
        String(button.dataset.system === systemId)
      );

    });

    loadPreview(system);

  }

  /* ========================================
     CREATE SYSTEM DISCOVERY BUTTONS
  ========================================= */

  layerList.textContent = '';

  systems.forEach((system) => {

    const button = document.createElement('button');

    button.type = 'button';

    button.className = 'bt-layer-button';

    button.dataset.system = system.id;

    button.textContent = system.label;

    button.setAttribute('aria-pressed', 'false');

    button.addEventListener('click', () => {

      selectSystem(system.id);

    });

    layerList.appendChild(button);

  });

  /* ========================================
     PERSPECTIVE BUTTONS
  ========================================= */

  document.querySelectorAll(
    '.bt-perspective'
  ).forEach((button) => {

    button.addEventListener('click', () => {

      selectSystem(button.dataset.system);

    });

  });

  /* ========================================
     FULLSCREEN CONTROLS
  ========================================= */

  let expandedMode = false;
  let previousBodyOverflow = '';

  function updateFullscreenButton() {

    const active =
      document.fullscreenElement === viewport ||
      expandedMode;

    fullscreenButton.textContent =
      active ? 'Exit Fullscreen' : 'Fullscreen';

    fullscreenButton.setAttribute(
      'aria-pressed',
      String(active)
    );

  }

  function closeExpandedMode() {

    expandedMode = false;

    viewport.classList.remove('bt-expanded');

    document.body.style.overflow =
      previousBodyOverflow;

    updateFullscreenButton();

  }

  function openExpandedMode() {

    previousBodyOverflow =
      document.body.style.overflow;

    expandedMode = true;

    viewport.classList.add('bt-expanded');

    document.body.style.overflow = 'hidden';

    updateFullscreenButton();

  }

  fullscreenButton.addEventListener(
    'click',
    async () => {

      if (expandedMode) {

        closeExpandedMode();
        return;

      }

      if (document.fullscreenElement === viewport) {

        if (document.exitFullscreen) {

          try {

            await document.exitFullscreen();

          } catch (error) {

            console.warn(
              'Unable to exit fullscreen:',
              error
            );

          }

        }

        return;

      }

      if (viewport.requestFullscreen) {

        try {

          await viewport.requestFullscreen();

          updateFullscreenButton();

          return;

        } catch (error) {

          console.warn(
            'Native fullscreen unavailable:',
            error
          );

        }

      }

      openExpandedMode();

    }
  );

  document.addEventListener(
    'fullscreenchange',
    updateFullscreenButton
  );

  document.addEventListener(
    'keydown',
    (event) => {

      if (event.key === 'Escape' && expandedMode) {

        closeExpandedMode();

      }

    }
  );

  /* ========================================
     INITIALIZE BIOTREE EXPLORER
  ========================================= */

  selectSystem('BT_PUBLIC_EXTERIOR');

  updateFullscreenButton();

  console.info(
    'HaloCyberLife BioTree Explorer initialized.'
  );

})();
</script>

</body>
</html>
